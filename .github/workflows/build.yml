# El taller entero en las tres plataformas: compilar, pasar las baterias y
# arrancar los GUIs.
#
#   build-all.sh   cada directorio por separado; dice TODOS los que fallan
#   check-all.sh   las baterias de `make check`, con limite de tiempo cada una
#   gui-humo.sh    cada GUI se lanza, tiene que seguir vivo, y se fotografia
#
# En Linux todo va dentro de Xvfb, para que las pruebas de los GUIs que
# necesitan servidor grafico no se salten. macOS y Windows ya tienen
# escritorio en los runners de GitHub.

name: build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

env:
  DIRS: >-
    engines/fue engines/fuf engines/fug engines/drtran engines/drvarma
    engines/drvec gui/fue gui/fug gui/drtran gui/atsw

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgsl-dev libglib2.0-dev \
            libgtk-3-dev zlib1g-dev xvfb xauth imagemagick \
            adwaita-icon-theme-full
      - name: Compilar
        run: bash .github/build-all.sh
      - name: Baterias
        if: always()
        timeout-minutes: 150
        run: xvfb-run -a -s "-screen 0 1600x1000x24" bash .github/check-all.sh
      - name: GUIs
        if: always()
        run: xvfb-run -a -s "-screen 0 1600x1000x24" bash .github/gui-humo.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-linux
          path: capturas/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: brew install pkg-config gtk+3 gsl adwaita-icon-theme
      - name: Compilar
        run: bash .github/build-all.sh
      - name: Baterias
        if: always()
        timeout-minutes: 150
        run: bash .github/check-all.sh
      - name: GUIs
        if: always()
        run: bash .github/gui-humo.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-macos
          path: capturas/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atsw-macos
          path: |
            engines/*/bin/
            engines/fug/fug
            gui/*/bin/
            gui/fug/gtk_fmg
            gui/drtran/drtran_gui
            gui/atsw/atsw_gui
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make git diffutils bc gawk sed grep coreutils procps-ng
          pacboy: >-
            gcc:p pkgconf:p gtk3:p gsl:p zlib:p python:p adwaita-icon-theme:p
      - name: Compilar
        run: bash .github/build-all.sh
      - name: Baterias
        if: always()
        timeout-minutes: 150
        run: bash .github/check-all.sh
      - name: GUIs
        if: always()
        run: bash .github/gui-humo.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-windows
          path: capturas/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atsw-windows
          path: |
            engines/**/*.exe
            gui/**/*.exe
          if-no-files-found: warn
