# Construye el taller entero en las tres plataformas.
#
# Cada directorio se compila por separado y se sigue adelante si uno falla:
# lo que interesa es ver TODOS los que no compilan en una plataforma, no
# solo el primero. El resumen del final dice cuales.

name: build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

env:
  DIRS: >-
    engines/fue engines/fuf engines/fug engines/drtran engines/drvarma
    engines/drvec gui/fue gui/fug gui/drtran gui/atsw

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgsl-dev libglib2.0-dev \
            libgtk-3-dev zlib1g-dev
      - name: Compilar
        run: bash .github/build-all.sh
      - name: Baterias
        if: always()
        run: bash .github/check-all.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: brew install pkg-config gtk+3 gsl
      - name: Compilar
        run: bash .github/build-all.sh
      - name: Baterias
        if: always()
        run: bash .github/check-all.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atsw-macos
          path: |
            engines/*/bin/
            engines/fug/fug
            gui/*/bin/
            gui/fug/gtk_fmg
            gui/drtran/drtran_gui
            gui/atsw/atsw_gui
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make git diffutils bc gawk sed grep coreutils
          pacboy: >-
            gcc:p pkgconf:p gtk3:p gsl:p zlib:p python:p
      - name: Compilar
        run: bash .github/build-all.sh
      - name: Baterias
        if: always()
        run: bash .github/check-all.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atsw-windows
          path: |
            engines/**/*.exe
            gui/**/*.exe
          if-no-files-found: warn
