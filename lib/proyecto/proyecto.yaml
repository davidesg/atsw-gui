id: SF_MEG
titulo: Inflación del área euro
creado: "2026-11-14"
analista: ""
herramienta: fue
raiz: .

series:
  IPC_ES:
    descripcion: Índice de precios de consumo armonizado, España
    fuente: Eurostat, tabla prc_hicp_midx
    bajada: "2026-09-20"
    unidades: índice 2015 = 100
  SUELTA:
    bajada: "2026-09-20"

# Ventanas declaradas sobre los datos. La COMPLETA es la
